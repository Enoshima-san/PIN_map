version: '3.8'
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: pin_db
      POSTGRES_USER: pin_user
      POSTGRES_PASSWORD: pin_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # После старта вручную: CREATE EXTENSION pgrouting;

volumes:
  pgdata:
